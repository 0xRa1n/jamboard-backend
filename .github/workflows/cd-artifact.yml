name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-backend-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: "20"

jobs:
  package:
    name: Package Release Artifact
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create release package
        run: |
          rm -rf release
          mkdir -p release
          cp server.js release/server.js
          cp database.js release/database.js
          cp package.json release/package.json
          cp package-lock.json release/package-lock.json
          cp -r config release/config || true
          cp -r controllers release/controllers || true
          cp -r middleware release/middleware || true
          cp -r routes release/routes || true
          cp -r services release/services || true
          cp -r shared release/shared || true
          tar -czf jamboard-backend-${{ github.sha }}.tar.gz -C release .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: jamboard-backend-release-${{ github.sha }}
          path: jamboard-backend-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to Production
    needs: [package]
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - name: Deploy
        run: echo "Configure deployment command for your production host (Render/VPS)."
